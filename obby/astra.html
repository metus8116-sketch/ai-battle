<script>
'use strict';
const $=id=>document.getElementById(id);
const sky=$('sky'),canvas=$('world');
function random(seed){return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function hash(x,y){let n=Math.imul(x,1597334677)^Math.imul(y,3812015801);n=Math.imul(n^(n>>>16),2246822507);return ((n^(n>>>13))>>>0)/4294967296}

function drawSky(){
 const w=sky.width=Math.ceil(innerWidth/2.5),h=sky.height=Math.ceil(innerHeight/2.5),c=sky.getContext('2d'),im=c.createImageData(w,h),data=im.data;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const u=x/w,v=y/h,n=.52*noise(x/58,y/43)+.28*noise(x/28+22,y/19)+.14*noise(x/12,y/10)+.06*noise(x/5,y/4);
  const band=Math.exp(-Math.pow((v-.68+.23*Math.sin(u*5.8+.6))/.23,2)),cloud=Math.floor(Math.max(0,n-.32)*band*18)/18, depth=Math.floor(Math.max(0,n-.44)*9)/9;
  const i=4*(y*w+x);data[i]=17+v*17+n*9+cloud*75+depth*12;data[i+1]=17+v*9+n*6+cloud*40;data[i+2]=38+v*20+n*15+cloud*99+depth*15;data[i+3]=255;
 }c.putImageData(im,0,0);
 const rnd=random(419),cols=['#766d9b','#534e79','#9993b2','#b1a8cf','#d5c5e3','#c0d3db'];
 for(let i=0;i<w*h/82;i++){const x=Math.floor(rnd()*w),y=Math.floor(rnd()*h);c.fillStyle=cols[Math.floor(rnd()*cols.length)];let s=rnd();c.fillRect(x,y,1,1);if(s>.96){c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3)}if(s>.993){c.fillRect(x-2,y,5,1);c.fillRect(x,y-3,1,7);c.fillStyle='#fff2df';c.fillRect(x,y,1,1)}}
 // Rasterize a striped ice giant, including the front and back of its tilted rings.
 function planet(cx,cy,r,ring){cx=Math.round(cx);cy=Math.round(cy);const co=.955,si=-.296,rad=Math.ceil(r*(ring?2.08:1.04));for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++){
  const a=(x*co+y*si)/r,b=(-x*si+y*co)/r,er=Math.sqrt(a*a+b*b/.065),d=(x*x+y*y)/(r*r);
  const onRing=ring&&er>1.29&&er<2.02&&!(er>1.66&&er<1.76);
  let color='';if(onRing)color=er>1.91?'#85c6bd':er<1.48?'#87bfb7':er<1.57?'#516f87':'#adcfc4';
  if(d<=1&&!(onRing&&b>0)){let nz=Math.sqrt(1-d),light=(-.49*x/r-.56*y/r+.66*nz),lat=(y*.96+x*.18)/r+.10*Math.sin(x/r*2.6+1.4)+.065*noise(x/6+30,y/4+8);
   let stripe=Math.sin(lat*13+1)+.45*Math.sin(lat*32);let k=Math.max(0,Math.min(6,Math.floor((light*.72+(stripe>.69?.22:stripe<-.8?-.10:0)+.19)*6)));
   color=(ring?['#3b4169','#475d7b','#537b8a','#6d9d9f','#87b7ae','#a4d3bc','#c3e4ca']:['#595176','#675a82','#7d6c92','#9986a5','#a992b0','#bfabbd','#c8b2c5'])[k];
   if(!ring&&((x/r+.24)**2+(y/r+.23)**2<.045||(x/r-.3)**2+(y/r-.27)**2<.022))color='#78678b';
  }if(color){c.fillStyle=color;c.fillRect(cx+x,cy+y,1,1)}
 }}
 planet(w*.145,h*.393,Math.min(w*.046,h*.078),true);planet(w*.87,h*.326,Math.min(w*.015,h*.023),false);
}
const gl=canvas.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:false});
if(!gl){$('toast').textContent='Enable WebGL to play Orbit Hop';$('toast').className='visible';throw Error('WebGL unavailable')}
const vert=`attribute vec3 pos,col;uniform vec3 origin,eye,right,up,forward;uniform vec2 lens,turn;uniform float fade;varying vec3 color;
void main(){vec3 p=vec3(pos.x*turn.x+pos.z*turn.y,pos.y,pos.z*turn.x-pos.x*turn.y)+origin-eye;
float d=dot(p,forward);gl_Position=vec4(dot(p,right)*lens.x,dot(p,up)*lens.y,d*1.001668-.200167,d);
color=mix(col,vec3(.20,.16,.32),min(.78,max(0.,d-15.)*.008+fade));}`;
const frag='precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.);}';

const loc={};for(const n of ['pos','col']){loc[n]=gl.getAttribLocation(prog,n);gl.enableVertexAttribArray(loc[n])}for(const n of ['origin','eye','right','up','forward','lens','turn','fade'])loc[n]=gl.getUniformLocation(prog,n);
gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);
const rgbCache={};function rgb(hex){return rgbCache[hex]||(rgbCache[hex]=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255))}
const sub=(a,b)=>a.map((n,i)=>n-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{let n=Math.hypot(...a)||1;return a.map(x=>x/n)};
function oval(m,x,y,z,w,d,c){const pts=[];for(let i=0;i<10;i++){let a=i*Math.PI/5;pts.push([x+Math.cos(a)*w,y,z+Math.sin(a)*d])}m.face(pts,c)}
class Mesh{
 constructor(){this.data=[]}
 face(points,c,shade=1){let color=rgb(c).map(k=>Math.min(1,k*shade));for(let i=1;i<points.length-1;i++)for(const p of [points[0],points[i],points[i+1]])this.data.push(...p,...color)}
 box(x,y,z,w,h,d,c){let a=x-w/2,b=x+w/2,l=z-d/2,r=z+d/2,t=y+h/2,s=y-h/2;
 this.face([[a,t,l],[b,t,l],[b,t,r],[a,t,r]],c,1.06);this.face([[a,s,r],[b,s,r],[b,t,r],[a,t,r]],c,.84);this.face([[b,s,r],[b,s,l],[b,t,l],[b,t,r]],c,.65);this.face([[a,s,l],[a,s,r],[a,t,r],[a,t,l]],c,.91);this.face([[b,s,l],[a,s,l],[a,t,l],[b,t,l]],c,.73);this.face([[a,s,r],[a,s,l],[b,s,l],[b,s,r]],c,.5)}
 slab(x,y,z,w,h,d,cut,c){let a=w/2,b=d/2,k=Math.min(cut,a*.7,b*.7),r=[[-a+k,-b],[a-k,-b],[a,-b+k],[a,b-k],[a-k,b],[-a+k,b],[-a,b-k],[-a,-b+k]],top=r.map(([u,v])=>[x+u,y,z+v]);this.face(top,c,1.04);for(let i=0;i<8;i++){let j=(i+1)%8;this.face([top[i],top[j],[top[j][0],y-h,top[j][2]],[top[i][0],y-h,top[i][2]]],c,[.7,.67,.62,.72,.83,.9,.94,.82][i])}this.face(top.map(p=>[p[0],y-h,p[2]]),c,.5)}
 build(){const v=new Float32Array(this.data);this.count=v.length/6;this.buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);gl.bufferData(gl.ARRAY_BUFFER,v,gl.STATIC_DRAW);this.data=null;return this}
 draw(x=0,y=0,z=0,angle=0,fade=0){gl.uniform3f(loc.origin,x,y,z);gl.uniform2f(loc.turn,Math.cos(angle),Math.sin(angle));gl.uniform1f(loc.fade,fade);gl.bindBuffer(gl.ARRAY_BUFFER,this.buf);gl.vertexAttribPointer(loc.pos,3,gl.FLOAT,false,24,0);gl.vertexAttribPointer(loc.col,3,gl.FLOAT,false,24,12);gl.drawArrays(gl.TRIANGLES,0,this.count)}
}

 let dist=ratio<1.1?1.23:1,eye=[camera.x+6.8*dist,camera.y+7.1*dist,camera.z+12.0*dist],aim=[camera.x-.10,camera.y+1.00,camera.z-3.25];
 let f=norm(sub(aim,eye)),r=norm(cross(f,[0,1,0])),u=cross(r,f),focal=1/Math.tan(40*Math.PI/360);gl.uniform3fv(loc.eye,eye);gl.uniform3fv(loc.right,r);gl.uniform3fv(loc.up,u);gl.uniform3fv(loc.forward,f);gl.uniform2f(loc.lens,focal/ratio,focal);
 for(const a of scenery)a.mesh.draw(a.x,a.y+Math.sin(anim*.34+a.phase)*.12,a.z,a.phase,.19);
 for(const a of platforms){a.mesh.draw(a.x,a.y,a.z);if(a.kind==='lava'&&Math.abs(p.z-a.z)<27){
  for(let i=0;i<6;i++){const seed=a.id*17+i,t=(anim*(.43+hash(seed,2)*.3)+hash(seed,5))%1;
   if(t<.8)ember.draw(a.x+(hash(seed,3)-.5)*(a.w-.32)+.12*t,a.y+.16+t*.63,a.z+(hash(seed,4)-.5)*.8,anim+seed)}
 }}
 for(const a of platforms)if(inside(a,p.x,p.z,-.15)&&p.y>=a.y-.02&&p.y-a.y<4){shadow.draw(p.x,a.y+.054,p.z);break}
 const speed=Math.min(1,Math.hypot(p.vx,p.vz)/5),stride=p.ground?Math.sin(stepPhase)*speed:0,bob=p.ground?Math.abs(stride)*.045:.018,a=p.angle;
 function part(mesh,x,y,z){mesh.draw(p.x+x*Math.cos(a)+z*Math.sin(a),p.y+y,p.z+z*Math.cos(a)-x*Math.sin(a),a)}
 if(respawnFlash<=0||Math.floor(respawnFlash*19)%2===0){part(suit,0,bob,0);for(let s of [-1,1]){let phase=s*stride;part(leg,s*.204,p.ground?Math.max(0,phase)*.12:(s===1?.13:.025),p.ground?-phase*.19:s*.10);part(arm,s*.54,bob+(p.ground?0:.07),phase*.15-.015)}}
 for(const a of particles)dust.draw(a.x,a.y,a.z,anim*2);
}
let displayed=-1;
function frame(now){if(!lastTime)lastTime=now;accum+=Math.min(.12,(now-lastTime)/1000);lastTime=now;while(accum>=1/120){update(1/120);accum-=1/120}if(Math.floor(elapsed*100)!==displayed){displayed=Math.floor(elapsed*100);$('time').innerHTML=clockText(elapsed)}render();requestAnimationFrame(frame)}
resize();restart();requestAnimationFrame(frame);
</script>
